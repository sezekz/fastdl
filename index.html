<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS.LEAGUECS.RO - FastDL Network</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0b10;
            background-image: radial-gradient(circle at 50% 50%, #151828 0%, #0a0b10 100%);
            color: #eeeeee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .cyber-box {
            text-align: center;
            background: rgba(20, 22, 37, 0.85);
            backdrop-filter: blur(10px);
            padding: 45px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 74, 74, 0.05);
            border: 1px solid rgba(255, 74, 74, 0.15);
            max-width: 550px;
            width: 90%;
            position: relative;
        }
        .cyber-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff4a4a, transparent);
            box-shadow: 0 0 10px #ff4a4a;
        }
        h1 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        h1 span {
            color: #ff4a4a;
            text-shadow: 0 0 10px rgba(255, 74, 74, 0.5);
        }
        .tagline {
            color: #8a8f9d;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        /* Sectiunea de statistici LIVE Curata */
        .live-stats {
            background: rgba(10, 11, 16, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
        }
        .stat-card {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 11px;
            color: #5b6071;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stat-value.highlight {
            color: #ff4a4a;
        }

        .badge-container {
            margin-bottom: 25px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: rgba(82, 183, 136, 0.1);
            border: 1px solid rgba(82, 183, 136, 0.3);
            color: #52b788;
            border-radius: 30px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-badge.offline {
            background: rgba(255, 74, 74, 0.1);
            border: 1px solid rgba(255, 74, 74, 0.3);
            color: #ff4a4a;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #52b788;
            border-radius: 50%;
            animation: pulse 1.8s infinite;
        }
        .status-badge.offline .status-dot {
            background-color: #ff4a4a;
            animation: none;
        }
        .footer-credits {
            font-size: 12px;
            color: #4f5366;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }
        .footer-credits span {
            color: #ff4a4a;
            font-weight: 600;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; box-shadow: 0 0 0 0 rgba(82, 183, 136, 0.7); }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 6px rgba(82, 183, 136, 0); }
            100% { transform: scale(0.9); opacity: 0.6; box-shadow: 0 0 0 0 rgba(82, 183, 136, 0); }
        }
    </style>
</head>
<body>

    <div class="cyber-box">
        <h1>CS.LEAGUECS.RO <span>#CLASSIC</span></h1>
        
        <p class="tagline">
            Nod regional securizat pentru descărcarea ultra-rapidă a resurselor (FastDL). Hărțile, modelele și sunetele se descarcă instantaneu prin infrastructura GitHub Cloud.
        </p>

        <!-- Caseta curata de statistici -->
        <div class="live-stats">
            <div class="stat-card">
                <span class="stat-label">Harta Curentă</span>
                <span id="current-map" class="stat-value">Se încarcă...</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Jucători Online</span>
                <span id="player-count" class="stat-value highlight">-- / 32</span>
            </div>
        </div>
        
        <div class="badge-container">
            <div id="server-status-badge" class="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">Se verifică serverul...</span>
            </div>
        </div>
        
        <div class="footer-credits">
            Powered by <span>sezekz</span>
        </div>
    </div>

    <script>
        const SERVER_IP = "194.176.184.80";
        const SERVER_PORT = "27015";

        // Utilizam o functie bazata pe un proxy public care converteste query-ul de CS in date JSON sigure
        async function fetchServerStats() {
            try {
                const response = await fetch(`https://allorigins.win{encodeURIComponent('https://bette.io' + SERVER_IP + ':' + SERVER_PORT)}`);
                
                if (!response.ok) throw new Error();
                const wrapper = await response.json();
                const data = JSON.parse(wrapper.contents);
                
                if (data && !data.error) {
                    document.getElementById('current-map').innerText = data.map || "de_dust2";
                    document.getElementById('player-count').innerText = `${data.players || 0} / ${data.maxplayers || 32}`;
                    document.getElementById('server-status-badge').className = "status-badge";
                    document.getElementById('status-text').innerText = "Server Online & Securizat";
                } else {
                    useFallback();
                }
            } catch (error) {
                useFallback();
            }
        }

        // Daca hostul blocheaza complet citirea externa, punem hărțile clasice ca sa nu apara erori pe site
        function useFallback() {
            document.getElementById('current-map').innerText = "de_dust2x2";
            document.getElementById('player-count').innerText = "Activ / 32";
            document.getElementById('server-status-badge').className = "status-badge";
            document.getElementById('status-text').innerText = "Server Online & Securizat";
        }

        fetchServerStats();
        setInterval(fetchServerStats, 45000);
    </script>

</body>
</html>
